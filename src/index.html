<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Domotix GmbH – Gebäudeautomation für Wohnhäuser und KMU</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gebäudeautomation (KNX, Loxone, Control4), Smart Home und Planung für Wohnhäuser und KMU von Bern aus in der ganzen Schweiz.">
  <!-- Link previews (LinkedIn, WhatsApp, Teams …) read only this static HTML,
       not the tags the app sets per page, so they always show these defaults.
       No og:url here: it would make every shared page count as the home page. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Domotix GmbH">
  <meta property="og:locale" content="de_CH">
  <meta property="og:title" content="Domotix GmbH – Gebäudeautomation für Wohnhäuser und KMU">
  <meta property="og:description" content="Gebäudeautomation (KNX, Loxone, Control4), Smart Home und Planung für Wohnhäuser und KMU von Bern aus in der ganzen Schweiz.">
  <meta property="og:image" content="https://www.domotix.ch/assets/images/Landing/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/x-icon" href="./assets/favicons/favicon.ico" />
  <script
    src="https://analytics.domotix.swiss/api/script.js"
    data-site-id="7315bc4356a5"
    defer
  ></script>
  <script>
    // GitHub Pages SPA redirect: stellt den Pfad nach dem Redirect wieder her
    (function() {
      var redirect = sessionStorage.getItem('redirectPath');
      if (redirect) {
        sessionStorage.removeItem('redirectPath');
        window.history.replaceState(null, '', redirect);
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>
    <h1>Domotix GmbH</h1>
    <p>Gebäudeautomation (KNX, Loxone, Control4), Smart Home und Planung für Wohnhäuser und KMU von Bern aus in der ganzen Schweiz.</p>
    <p data-nosnippet>Bitte aktivieren Sie JavaScript, um die vollständige Website zu nutzen.</p>
  </noscript>
</body>
</html>

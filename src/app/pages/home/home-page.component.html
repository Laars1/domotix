<app-navigation></app-navigation>

<app-parallax-wrapper
  id="home"
  [imgSrcs]="['assets/images/Landing/Hero/hero-1.webp','assets/images/Landing/Hero/hero-2.webp','assets/images/Landing/Hero/hero-3.webp','assets/images/Landing/Hero/hero-4.webp']"
  [imgSrcsMobile]="['assets/images/Landing/Hero/hero-1-mobile.webp','assets/images/Landing/Hero/hero-2-mobile.webp','assets/images/Landing/Hero/hero-3-mobile.webp','assets/images/Landing/Hero/hero-4-mobile.webp']"
>
  <app-home></app-home>
</app-parallax-wrapper>

<app-container id="vision">
  <app-vision></app-vision>
</app-container>

<!-- About, the references teaser and the footer form one dark element down to
     the page end. Together at least a screen tall, so they cover the pinned
     vision view while sliding over it; spare height goes to the teaser. -->
<div class="dark-run">
  <app-container id="about">
    <app-about></app-about>
  </app-container>

  <app-cta-band text="references.teaser.text" [dark]="true">
    <a class="link-cta" [routerLink]="['/referenzen', lang]">{{ 'references.teaser.cta' | translate }}</a>
  </app-cta-band>

  <app-footer [inset]="true"></app-footer>
</div>

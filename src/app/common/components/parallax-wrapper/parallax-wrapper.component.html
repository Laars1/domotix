<div class="parallax" [ngClass]="customCss">
  <div
    class="parallax__slide"
    *ngFor="let src of slides; let i = index"
    [style]="slideStyle(i)"
    [class.parallax__slide--active]="i === currentIndex"
    [class.parallax__slide--has-mobile]="hasMobile(i)"
  ></div>
  <ng-content></ng-content>
</div>
